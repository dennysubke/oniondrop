plugins { id 'com.android.application' }
android {
    namespace 'de.dennysubke.oniondrop'
    compileSdk 35
    defaultConfig {
        applicationId 'de.dennysubke.oniondrop.standalone'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.2.0-alpha'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/libtor.so'] } }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation 'com.google.zxing:core:3.5.3' }
// Never create an apparently standalone APK without its Tor engine.
tasks.register('verifyTorBinaries') {
    doLast {
        if (!file('src/main/jniLibs/arm64-v8a/libtor.so').exists()) {
            throw new GradleException('Tor engine missing. Run scripts/build-native-tor.sh arm64-v8a first; see README.')
        }
    }
}
tasks.named('preBuild').configure { dependsOn 'verifyTorBinaries' }
