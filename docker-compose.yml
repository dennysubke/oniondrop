version: "3.7"

services:
  oniondrop:
    image: dennysubke/oniondrop:0.2.0
    container_name: oniondrop
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8397:8080"
    environment:
      PUID: "1000"
      PGID: "1000"
      ONIONDROP_DATA_DIR: /data
      ONIONDROP_PORT: "8080"
      ONIONDROP_AUTH_MODE: setup
      ONIONDROP_DEFAULT_LANGUAGE: en
      ONIONSHARE_VERSION: "2.6.4"
    volumes:
      - ./data:/data
