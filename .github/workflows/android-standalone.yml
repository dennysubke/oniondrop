name: OnionDrop standalone APK
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-standalone/**', '.github/workflows/android-standalone.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autopoint gettext pkg-config build-essential po4a libzstd-dev
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Core security and transfer tests
        run: bash android-standalone/tests/run.sh
      - name: Build pinned Tor 0.4.9.12
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash android-standalone/scripts/build-native-tor.sh arm64-v8a x86_64
      - name: Build standalone app
        working-directory: android-standalone
        run: gradle --no-daemon :app:assembleDebug :app:lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: OnionDrop-Standalone-0.2.0-alpha
          path: android-standalone/app/build/outputs/apk/debug/app-debug.apk
