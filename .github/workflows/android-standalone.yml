name: OnionDrop Android
on:
  workflow_dispatch:
  pull_request:
    paths: ['android-standalone/**', '.github/workflows/android-standalone.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autopoint gettext pkg-config build-essential po4a libzstd-dev
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;28.2.13676358'
      - name: Core security and transfer tests
        run: |
          bash android-standalone/tests/run.sh
          python3 android-standalone/tests/check-translations.py
      - uses: actions/cache/restore@v4
        id: tor-cache
        with:
          path: |
            android-standalone/app/src/main/jniLibs
            android-standalone/app/src/main/assets/licenses/native
          key: tor-android-cb04167d-ndk28.2-arm64-x86_64-licenses-v2
      - name: Fetch pinned native sources
        if: steps.tor-cache.outputs.cache-hit != 'true'
        run: git submodule update --init --recursive
      - name: Build pinned Tor 0.4.9.12
        if: steps.tor-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.2.13676358"
          bash android-standalone/scripts/build-native-tor.sh arm64-v8a x86_64
          python3 android-standalone/scripts/collect-native-licenses.py android-standalone/third_party/tor-android android-standalone/app/src/main/assets/licenses/native
      - uses: actions/cache/save@v4
        if: steps.tor-cache.outputs.cache-hit != 'true'
        with:
          path: |
            android-standalone/app/src/main/jniLibs
            android-standalone/app/src/main/assets/licenses/native
          key: tor-android-cb04167d-ndk28.2-arm64-x86_64-licenses-v2
      - name: Build and lint Android app
        working-directory: android-standalone
        run: |
          if ! gradle --no-daemon :app:assembleRelease :app:lintRelease; then
            cat app/build/intermediates/lint_intermediate_text_report/release/lintReportRelease/lint-results-release.txt || true
            exit 1
          fi
      - name: Package unsigned release and sign emulator copy
        run: |
          mkdir -p release-tools release
          cp android-standalone/app/build/outputs/apk/release/app-release-unsigned.apk release/OnionDrop-1.0.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" release-tools/apksigner.jar
          keytool -genkeypair -keystore "$RUNNER_TEMP/smoke.p12" -storepass smoke-test-only -keypass smoke-test-only -alias smoke -dname 'CN=OnionDrop CI test only' -keyalg RSA -keysize 2048 -validity 2
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$RUNNER_TEMP/smoke.p12" --ks-pass pass:smoke-test-only --out OnionDrop-smoke.apk release/OnionDrop-1.0.0-unsigned.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose OnionDrop-smoke.apk
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 4 OnionDrop-smoke.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging OnionDrop-smoke.apk > release/apk-manifest.txt
          if grep -q application-debuggable release/apk-manifest.txt; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: OnionDrop-release-build
          path: |
            release/
            release-tools/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: OnionDrop-emulator-apk
          path: OnionDrop-smoke.apk
          retention-days: 3
  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: OnionDrop-emulator-apk
          path: apk
      - name: Install Tor transfer test peer
        run: sudo apt-get update && sudo apt-get install -y tor curl
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 android-standalone/scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: OnionDrop-emulator-diagnostics
          path: android-smoke
